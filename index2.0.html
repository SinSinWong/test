<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貪食蛇遊戲 2.0 - GitHub Pages 版本</title>
    <style>
        /* 簡化版CSS，確保兼容性 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #4CAF50;
            text-align: center;
        }
        
        .game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            width: 100%;
        }
        
        .game-board {
            border: 2px solid #4CAF50;
            border-radius: 8px;
            overflow: hidden;
        }
        
        canvas {
            display: block;
            background-color: #000;
        }
        
        .side-panel {
            min-width: 250px;
        }
        
        .score-panel {
            background: rgba(50, 50, 50, 0.9);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .score-title {
            font-size: 1rem;
            color: #aaa;
            margin-bottom: 5px;
        }
        
        .score {
            font-size: 2.5rem;
            font-weight: bold;
            color: #4CAF50;
        }
        
        .high-score {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #555;
        }
        
        .controls {
            background: rgba(50, 50, 50, 0.9);
            border-radius: 8px;
            padding: 15px;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            width: 100%;
        }
        
        #startBtn {
            background-color: #4CAF50;
            color: white;
        }
        
        #resetBtn {
            background-color: #f44336;
            color: white;
        }
        
        #restartBtn {
            background-color: #2196F3;
            color: white;
        }
        
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .new-record {
            color: gold;
            font-size: 1.5rem;
            margin: 10px 0;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .game-container {
                flex-direction: column;
            }
            
            canvas {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>貪食蛇遊戲 2.0</h1>
        <p>控制蛇吃掉紅色蘋果，避免撞牆或撞到自己！</p>
        
        <div class="game-container">
            <div class="game-board">
                <canvas id="gameCanvas" width="600" height="450"></canvas>
                <div id="gameOver" class="game-over">
                    <h2>遊戲結束！</h2>
                    <p>得分: <span id="finalScore">0</span></p>
                    <p>最高分: <span id="finalHighScore">0</span></p>
                    <div id="newRecord" class="new-record" style="display: none;">
                        🎉 新紀錄！ 🎉
                    </div>
                    <button id="restartBtn">重新開始</button>
                </div>
            </div>
            
            <div class="side-panel">
                <div class="score-panel">
                    <div class="score-title">當前分數</div>
                    <div class="score" id="score">0</div>
                    <div class="high-score">
                        <div class="score-title">最高分紀錄</div>
                        <div class="score" id="highScore" style="color: #FF9800;">0</div>
                    </div>
                </div>
                
                <div class="controls">
                    <p>控制：方向鍵移動，空格鍵暫停</p>
                    <button id="startBtn">開始遊戲</button>
                    <button id="resetBtn">重新開始</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 遊戲核心代碼
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const gridWidth = canvas.width / gridSize;
        const gridHeight = canvas.height / gridSize;
        
        let snake = [];
        let food = {};
        let direction = 'right';
        let nextDirection = 'right';
        let gameSpeed = 120;
        let score = 0;
        let highScore = 0;
        let gameRunning = false;
        let gameLoop;
        
        // DOM元素
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const finalScoreElement = document.getElementById('finalScore');
        const finalHighScoreElement = document.getElementById('finalHighScore');
        const newRecordElement = document.getElementById('newRecord');
        const gameOverScreen = document.getElementById('gameOver');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const restartBtn = document.getElementById('restartBtn');
        
        // 初始化遊戲
        function initGame() {
            snake = [];
            for (let i = 4; i >= 0; i--) {
                snake.push({ x: i, y: Math.floor(gridHeight / 2) });
            }
            
            generateFood();
            direction = 'right';
            nextDirection = 'right';
            score = 0;
            scoreElement.textContent = score;
            gameSpeed = 120;
            
            loadHighScore();
            
            gameOverScreen.style.display = 'none';
            newRecordElement.style.display = 'none';
            
            draw();
        }
        
        // 載入最高分
        function loadHighScore() {
            const saved = localStorage.getItem('snakeHighScore');
            highScore = saved ? parseInt(saved) : 0;
            highScoreElement.textContent = highScore;
            finalHighScoreElement.textContent = highScore;
        }
        
        // 保存最高分
        function saveHighScore() {
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreElement.textContent = highScore;
                finalHighScoreElement.textContent = highScore;
                return true;
            }
            return false;
        }
        
        // 生成食物
        function generateFood() {
            let newFood;
            let valid = false;
            
            while (!valid) {
                valid = true;
                newFood = {
                    x: Math.floor(Math.random() * gridWidth),
                    y: Math.floor(Math.random() * gridHeight)
                };
                
                for (let segment of snake) {
                    if (segment.x === newFood.x && segment.y === newFood.y) {
                        valid = false;
                        break;
                    }
                }
            }
            
            food = newFood;
        }
        
        // 繪製遊戲
        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 畫蛇
            snake.forEach((segment, index) => {
                if (index === 0) {
                    ctx.fillStyle = '#4CAF50'; // 蛇頭
                } else {
                    ctx.fillStyle = '#2E7D32'; // 蛇身
                }
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 1, gridSize - 1);
            });
            
            // 畫食物
            ctx.fillStyle = '#f44336';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 1,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }
        
        // 更新遊戲狀態
        function update() {
            direction = nextDirection;
            const head = { ...snake[0] };
            
            switch (direction) {
                case 'up': head.y--; break;
                case 'down': head.y++; break;
                case 'left': head.x--; break;
                case 'right': head.x++; break;
            }
            
            // 檢查碰撞
            if (head.x < 0 || head.x >= gridWidth || head.y < 0 || head.y >= gridHeight) {
                gameOver();
                return;
            }
            
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }
            
            snake.unshift(head);
            
            // 吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                
                if (score % 50 === 0 && gameSpeed > 50) {
                    gameSpeed -= 10;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(update, gameSpeed);
                }
                
                generateFood();
            } else {
                snake.pop();
            }
            
            draw();
        }
        
        // 遊戲結束
        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            
            if (saveHighScore()) {
                newRecordElement.style.display = 'block';
            }
            
            finalScoreElement.textContent = score;
            gameOverScreen.style.display = 'flex';
            
            startBtn.textContent = '開始遊戲';
            startBtn.disabled = false;
            startBtn.style.backgroundColor = '#4CAF50';
        }
        
        // 開始遊戲
        function startGame() {
            if (gameRunning) return;
            
            if (snake.length === 0) {
                initGame();
            }
            
            gameRunning = true;
            gameLoop = setInterval(update, gameSpeed);
            startBtn.textContent = '遊戲中...';
            startBtn.disabled = true;
            startBtn.style.backgroundColor = '#777';
        }
        
        // 重置遊戲
        function resetGame() {
            clearInterval(gameLoop);
            gameRunning = false;
            startBtn.textContent = '開始遊戲';
            startBtn.disabled = false;
            startBtn.style.backgroundColor = '#4CAF50';
            initGame();
        }
        
        // 鍵盤控制
        document.addEventListener('keydown', (e) => {
            if ([37, 38, 39, 40].includes(e.keyCode)) {
                e.preventDefault();
            }
            
            switch (e.keyCode) {
                case 38: if (direction !== 'down') nextDirection = 'up'; break;
                case 40: if (direction !== 'up') nextDirection = 'down'; break;
                case 37: if (direction !== 'right') nextDirection = 'left'; break;
                case 39: if (direction !== 'left') nextDirection = 'right'; break;
                case 32:
                    if (gameRunning) {
                        clearInterval(gameLoop);
                        gameRunning = false;
                        startBtn.textContent = '繼續遊戲';
                        startBtn.disabled = false;
                        startBtn.style.backgroundColor = '#4CAF50';
                    } else {
                        startGame();
                    }
                    break;
            }
        });
        
        // 按鈕事件
        startBtn.addEventListener('click', startGame);
        resetBtn.addEventListener('click', resetGame);
        restartBtn.addEventListener('click', resetGame);
        
        // 初始化
        initGame();
    </script>
</body>
</html>
